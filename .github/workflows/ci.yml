name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.14.5"
            otp: "25.3"
          - elixir: "1.17.3"
            otp: "27.2"
          - elixir: "1.20.0"
            otp: "28.3"

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: epmd -daemon
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix test --cover
